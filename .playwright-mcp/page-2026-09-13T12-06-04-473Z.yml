                  - paragraph [ref=f31e50]: Binary Heap เป็นแค่หนึ่งในหลายวิธี (ยังมี d-Heap, Leftist Heap, Binomial Heap, Fibonacci Heap) แต่เป็นแบบที่ใช้บ่อยที่สุด เพราะ implement ง่ายและมี constant factor ต่ำ
                  - heading "3 คุณสมบัติที่ 1 — Structure Property" [level=3] [ref=f31e51]:
                    - generic [ref=f31e52]: "3"
                    - text: คุณสมบัติที่ 1 — Structure Property
                  - paragraph [ref=f31e53]: "Binary Heap ต้องเป็น complete binary tree: เติมเต็มทุกชั้นจากซ้ายไปขวา ห้ามมีช่องว่างระหว่างทาง คุณสมบัตินี้ทำให้ tree มีรูปแบบตายตัว จึงแทนด้วย array ได้พอดีโดยไม่ต้องเก็บ pointer ซ้าย/ขวา/พ่อเลย"
