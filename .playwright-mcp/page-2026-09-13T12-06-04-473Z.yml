                  - paragraph [ref=f31e67]: ค่าของพ่อ ≤ ค่าของลูกเสมอ (สำหรับ min-heap) ทุกโหนดยกเว้น root ผลที่ตามมาคือ ค่าน้อยที่สุดของทั้งต้นไม้อยู่ที่ root เสมอ (array[1]) — deleteMin จึงรู้ตำแหน่งคำตอบทันที โดยไม่ต้องค้นหาเลย
                  - heading "5 Insert — ใส่ค่าใหม่โดยไม่ทำลาย heap property" [level=3] [ref=f31e68]:
                    - generic [ref=f31e69]: "5"
                    - text: Insert — ใส่ค่าใหม่โดยไม่ทำลาย heap property
                  - paragraph [ref=f31e70]: หลักการคือสร้าง "ช่องว่าง (hole)" ที่ตำแหน่งถัดไปสุดท้ายของ array (รักษา structure property) แล้วเทียบค่าใหม่กับพ่อของ hole ไปเรื่อยๆ ถ้าค่าใหม่ น้อยกว่า พ่อ แสดงว่าผิด heap-order → ย้ายพ่อลงมาแทนที่ hole แล้วขยับ hole ขึ้นไปแทนตำแหน่งพ่อ (เรียกว่า percolate up) ทำซ้ำจนกว่าค่าใหม่จะไม่เล็กกว่าพ่อ แล้วค่อยใส่ค่าจริงลงใน hole
