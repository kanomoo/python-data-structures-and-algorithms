                    - listitem [ref=f31e74]: ออกจากลูปเมื่อ hole ถึง root หรือค่าใหม่ไม่เล็กกว่าพ่อแล้ว
                    - listitem [ref=f31e75]: ใส่ค่าจริงที่ hole สุดท้าย
                  - heading "6 deleteMin — ดึงตัวน้อยสุดออกโดยไม่ทำลาย heap property" [level=3] [ref=f31e76]:
                    - generic [ref=f31e77]: "6"
                    - text: deleteMin — ดึงตัวน้อยสุดออกโดยไม่ทำลาย heap property
                  - paragraph [ref=f31e78]: เก็บค่า root ไว้เป็นคำตอบ แล้วเอา element ตัวสุดท้ายของ array มาใส่ที่ root แทน (รักษา structure property) ค่าที่ย้ายมาอาจใหญ่เกินไปจนผิด heap-order → เทียบกับ ลูกที่มีค่าน้อยกว่า ระหว่างลูกซ้ายกับลูกขวา ถ้า root ใหญ่กว่า ให้สลับค่าลงไป (เรียกว่า percolate down) ทำซ้ำจนกว่าจะไม่ผิด heap-order หรือไม่มีลูกแล้ว
