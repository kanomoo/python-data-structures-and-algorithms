            - code [ref=f46e1071]: "class Node: \"\"\"โครงสร้าง Node สำหรับ Singly Linked List\"\"\" def __init__(self, data): self.data = data self.next = None def __repr__(self): return f\"Node({self.data})\" class SinglyLinkedList: \"\"\"คลาสจัดการ Singly Linked List พร้อมเมธอด Insert, Remove, Search\"\"\" def __init__(self): self.head = None self.size = 0 def is_empty(self) -> bool: return self.head is None def add_first(self, item): \"\"\"แทรกข้อมูลที่หน้าสุดของ List -> O(1)\"\"\" new_node = Node(item) new_node.next = self.head self.head = new_node self.size += 1 print(f\"[add_first] แทรก {item} ไว้ที่ Head เรียบร้อย (size = {self.size})\") def append(self, item): \"\"\"แทรกข้อมูลต่อท้าย List -> O(N)\"\"\" new_node = Node(item) if self.is_empty(): self.head = new_node else: curr = self.head while curr.next is not None: curr = curr.next curr.next = new_node self.size += 1 print(f\"[append] เพิ่ม {item} ต่อท้าย List (size = {self.size})\") def insert_at(self, index: int, item): \"\"\"แทรกข้อมูล ณ ดรรชนี index ที่ระบุ -> O(N)\"\"\" if index <= 0 or self.is_empty(): self.add_first(item) return if index >= self.size: self.append(item) return # วนลูปหาตำแหน่ง prev และ curr prev = None curr = self.head for _ in range(index): prev = curr curr = curr.next new_node = Node(item) new_node.next = curr prev.next = new_node self.size += 1 print(f\"[insert_at] แทรก {item} ที่ตำแหน่ง index={index} (prev={prev.data}, curr={curr.data})\") def remove(self, target) -> bool: \"\"\"ค้นหาและลบโหนดแรกที่มี data == target -> O(N)\"\"\" if self.is_empty(): print(f\"[remove] ล้มเหลว: List ว่างเปล่า ไม่สามารถลบ {target} ได้\") return False # กรณีที่ 1: โหนดเป้าหมายอยู่ที่ Head if self.head.data == target: deleted_node = self.head self.head = self.head.next self.size -= 1 print(f\"[remove] ลบโหนด Head ({target}) สำเร็จ! head ขยับไปที่ {self.head}\") return True # กรณีที่ 2: วนลูปค้นหาด้วยตัวชี้คู่ (prev และ curr) prev = self.head curr = self.head.next while curr is not None and curr.data != target: prev = curr curr = curr.next # ถ้า curr ไม่ใช่ None แสดงว่าพบโหนดเป้าหมาย if curr is not None: # หัวใจสำคัญ: เชื่อมข้ามโหนด curr prev.next = curr.next self.size -= 1 print(f\"[remove] ลบโหนด ({target}) สำเร็จ! โดยสั่ง prev({prev.data}).next = curr.next({curr.next})\") return True print(f\"[remove] ไม่พบข้อมูล {target} ใน List\") return False def search(self, target) -> int: \"\"\"ค้นหาตำแหน่ง index ของข้อมูล -> O(N)\"\"\" curr = self.head idx = 0 while curr is not None: if curr.data == target: return idx curr = curr.next idx += 1 return -1 def print_diagram(self): \"\"\"พิมพ์แผนผังจำลองโครงสร้างหน่วยความจำ\"\"\" nodes = [] curr = self.head while curr: nodes.append(f\"[{curr.data} | next]\") curr = curr.next nodes.append(\"None\") print(\"head -> \" + \" ---> \".join(nodes)) # --- ตัวอย่างการทดสอบใช้งานจริง (Test Drive) --- if __name__ == \"__main__\": ll = SinglyLinkedList() # 1. ทดสอบการแทรก ll.append(10) ll.append(20) ll.append(30) ll.add_first(5) ll.insert_at(2, 15) ll.print_diagram() # 2. ทดสอบการค้นหา pos = ll.search(20) print(f\"ค่า 20 อยู่ที่ index: {pos}\") # 3. ทดสอบการลบโหนดตรงกลาง (ใช้ prev และ curr) ll.remove(20) ll.print_diagram() # 4. ทดสอบลบตัวหน้าสุด ll.remove(5) ll.print_diagram()"
