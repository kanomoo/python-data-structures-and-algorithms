            - code [ref=f46e1270]: "class Node: def __init__(self, data): self.data = data self.next = None def get_next(self): return self.next def set_next(self, new_next): self.next = new_next class LinkedList: def __init__(self): self.head = None def add(self, item): new_node = Node(item) new_node.set_next(self.head) self.head = new_node def insert(self, item, pos): if pos == 0: self.add(item) return curr = self.head for _ in range(pos - 1): curr = curr.get_next() new_node = Node(item) new_node.set_next(curr.get_next()) curr.set_next(new_node) def print_list(self): curr = self.head res = [] while curr is not None: res.append(str(curr.data)) curr = curr.get_next() print(\" -> \".join(res) + \" -> None\") if __name__ == \"__main__\": mylist = LinkedList() # สร้าง List: 0, 1, 2, 3, 6, 7 mylist.add(6) mylist.add(1) mylist.insert(2, 2) mylist.add(0) mylist.insert(3, 4) mylist.insert(7, 6) print(\"📋 ลิสต์ก่อนสลับ Pointer:\") mylist.print_list() # ระบุตัวแปรชี้แต่ละโหนดตามโจทย์ข้อสอบ node1 = mylist.head # 0 node2 = node1.get_next() # 1 node3 = node2.get_next() # 2 node4 = node3.get_next() # 3 node5 = node4.get_next() # 6 node6 = node5.get_next() # 7 # สลับ Pointer 4 ขั้นตอน node6.set_next(node2) node5.set_next(node1) node1.set_next(None) mylist.head = node6 print(\"\\n✅ ลิสต์หลังสลับ Pointer (ตรงตามเฉลยข้อสอบ):\") mylist.print_list()"
