                      - heading "ทำไมความสูงเป็น O(log N)" [level=4] [ref=f20e63]
                      - paragraph [ref=f20e64]: ถ้า heap สูง h ชั้น จะมีสมาชิกได้ระหว่าง 2ʰ ถึง 2ʰ⁺¹−1 ตัว เพราะ tree เติมเต็มแน่นทุกชั้น ดังนั้นความสูงของ heap ที่มี N ตัวจึงเป็น O(log N) — นี่คือเหตุผลที่ insert/deleteMin เร็ว เพราะแค่เดินขึ้น-ลงตามความสูงของ tree เท่านั้น
                  - heading "4 คุณสมบัติที่ 2 — Heap-Order Property" [level=3] [ref=f20e65]:
