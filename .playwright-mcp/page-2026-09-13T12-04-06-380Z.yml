                    - listitem [ref=f20e74]: ออกจากลูปเมื่อ hole ถึง root หรือค่าใหม่ไม่เล็กกว่าพ่อแล้ว
                    - listitem [ref=f20e75]: ใส่ค่าจริงที่ hole สุดท้าย
                  - heading "6 deleteMin — ดึงตัวน้อยสุดออกโดยไม่ทำลาย heap property" [level=3] [ref=f20e76]:
