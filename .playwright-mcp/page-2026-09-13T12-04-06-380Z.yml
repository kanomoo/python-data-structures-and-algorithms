                  - paragraph [ref=f20e78]: เก็บค่า root ไว้เป็นคำตอบ แล้วเอา element ตัวสุดท้ายของ array มาใส่ที่ root แทน (รักษา structure property) ค่าที่ย้ายมาอาจใหญ่เกินไปจนผิด heap-order → เทียบกับ ลูกที่มีค่าน้อยกว่า ระหว่างลูกซ้ายกับลูกขวา ถ้า root ใหญ่กว่า ให้สลับค่าลงไป (เรียกว่า percolate down) ทำซ้ำจนกว่าจะไม่ผิด heap-order หรือไม่มีลูกแล้ว
