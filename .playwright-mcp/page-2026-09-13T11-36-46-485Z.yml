          - textbox "เขียนโค้ด Python ที่นี่ (รองรับ Tab, Indent, และกด Ctrl+Enter เพื่อรัน)..." [ref=f3e100]: "class StudentNode: def __init__(self, student_id, name, gpa): self.student_id = student_id self.name = name self.gpa = gpa self.next = None class StudentLinkedList: def __init__(self): self.head = None self.size = 0 def insert_front(self, student_id, name, gpa): new_node = StudentNode(student_id, name, gpa) new_node.next = self.head self.head = new_node self.size += 1 print(f\"Inserted front: {student_id} ({name})\") def insert_end(self, student_id, name, gpa): new_node = StudentNode(student_id, name, gpa) if not self.head: self.head = new_node else: curr = self.head while curr.next: curr = curr.next curr.next = new_node self.size += 1 print(f\"Inserted end: {student_id} ({name})\") def delete(self, student_id): curr = self.head prev = None while curr and curr.student_id != student_id: prev = curr curr = curr.next if not curr: print(f\"Not found: {student_id}\") return False if not prev: self.head = curr.next else: prev.next = curr.next self.size -= 1 print(f\"Deleted student: {student_id}\") return True def display(self): curr = self.head res = [] while curr: res.append(f\"[{curr.student_id}: {curr.name} ({curr.gpa})]\") curr = curr.next print(\" -> \".join(res) if res else \"List is empty\") # ทดสอบการทำงาน slist = StudentLinkedList() slist.insert_front(\"612037\", \"Somchai\", 3.50) slist.insert_end(\"612045\", \"Somsak\", 2.85) slist.insert_end(\"612089\", \"Wichai\", 3.90) slist.insert_front(\"612102\", \"Apinya\", 3.15) slist.display() slist.delete(\"612045\") slist.display()"
