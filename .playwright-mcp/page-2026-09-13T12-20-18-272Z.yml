        - paragraph [ref=f37e50]: Binary Heap เป็นแค่หนึ่งในหลายวิธี (ยังมี d-Heap, Leftist Heap, Binomial Heap, Fibonacci Heap) แต่เป็นแบบที่ใช้บ่อยที่สุด เพราะ implement ง่ายและมี constant factor ต่ำ
        - heading "3 คุณสมบัติที่ 1 — Structure Property" [level=3] [ref=f37e51]:
          - generic [ref=f37e52]: "3"
          - text: คุณสมบัติที่ 1 — Structure Property
        - paragraph [ref=f37e53]: "Binary Heap ต้องเป็น complete binary tree: เติมเต็มทุกชั้นจากซ้ายไปขวา ห้ามมีช่องว่างระหว่างทาง คุณสมบัตินี้ทำให้ tree มีรูปแบบตายตัว จึงแทนด้วย array ได้พอดีโดยไม่ต้องเก็บ pointer ซ้าย/ขวา/พ่อเลย"
        - generic [ref=f37e54]:
          - generic [ref=f37e55]:
            - heading "การแปลง index ↔ ตำแหน่งใน tree" [level=4] [ref=f37e56]
            - paragraph [ref=f37e57]: สำหรับสมาชิกที่ตำแหน่ง i ใน array (เริ่มนับที่ index 1 เพราะ index 0 ไม่ใช้งาน)
            - generic [ref=f37e58]:
              - generic [ref=f37e59]: left child = 2i
              - generic [ref=f37e60]: right child = 2i+1
              - generic [ref=f37e61]: parent = i // 2
          - generic [ref=f37e62]:
            - heading "ทำไมความสูงเป็น O(log N)" [level=4] [ref=f37e63]
            - paragraph [ref=f37e64]: ถ้า heap สูง h ชั้น จะมีสมาชิกได้ระหว่าง 2ʰ ถึง 2ʰ⁺¹−1 ตัว เพราะ tree เติมเต็มแน่นทุกชั้น ดังนั้นความสูงของ heap ที่มี N ตัวจึงเป็น O(log N) — นี่คือเหตุผลที่ insert/deleteMin เร็ว เพราะแค่เดินขึ้น-ลงตามความสูงของ tree เท่านั้น
        - heading "4 คุณสมบัติที่ 2 — Heap-Order Property" [level=3] [ref=f37e65]:
          - generic [ref=f37e66]: "4"
          - text: คุณสมบัติที่ 2 — Heap-Order Property
        - paragraph [ref=f37e67]: ค่าของพ่อ ≤ ค่าของลูกเสมอ (สำหรับ min-heap) ทุกโหนดยกเว้น root ผลที่ตามมาคือ ค่าน้อยที่สุดของทั้งต้นไม้อยู่ที่ root เสมอ (array[1]) — deleteMin จึงรู้ตำแหน่งคำตอบทันที โดยไม่ต้องค้นหาเลย
        - heading "5 Insert — ใส่ค่าใหม่โดยไม่ทำลาย heap property" [level=3] [ref=f37e68]:
          - generic [ref=f37e69]: "5"
          - text: Insert — ใส่ค่าใหม่โดยไม่ทำลาย heap property
        - paragraph [ref=f37e70]: หลักการคือสร้าง "ช่องว่าง (hole)" ที่ตำแหน่งถัดไปสุดท้ายของ array (รักษา structure property) แล้วเทียบค่าใหม่กับพ่อของ hole ไปเรื่อยๆ ถ้าค่าใหม่ น้อยกว่า พ่อ แสดงว่าผิด heap-order → ย้ายพ่อลงมาแทนที่ hole แล้วขยับ hole ขึ้นไปแทนตำแหน่งพ่อ (เรียกว่า percolate up) ทำซ้ำจนกว่าค่าใหม่จะไม่เล็กกว่าพ่อ แล้วค่อยใส่ค่าจริงลงใน hole
        - list [ref=f37e71]:
          - listitem [ref=f37e72]: สร้าง hole ที่ตำแหน่ง currentSize หลังเพิ่มขนาด
          - listitem [ref=f37e73]: วนเทียบ x < array[hole // 2] — ถ้าจริง ย้ายพ่อลงมา แล้ว hole //= 2
          - listitem [ref=f37e74]: ออกจากลูปเมื่อ hole ถึง root หรือค่าใหม่ไม่เล็กกว่าพ่อแล้ว
          - listitem [ref=f37e75]: ใส่ค่าจริงที่ hole สุดท้าย
        - heading "6 deleteMin — ดึงตัวน้อยสุดออกโดยไม่ทำลาย heap property" [level=3] [ref=f37e76]:
          - generic [ref=f37e77]: "6"
          - text: deleteMin — ดึงตัวน้อยสุดออกโดยไม่ทำลาย heap property
        - paragraph [ref=f37e78]: เก็บค่า root ไว้เป็นคำตอบ แล้วเอา element ตัวสุดท้ายของ array มาใส่ที่ root แทน (รักษา structure property) ค่าที่ย้ายมาอาจใหญ่เกินไปจนผิด heap-order → เทียบกับ ลูกที่มีค่าน้อยกว่า ระหว่างลูกซ้ายกับลูกขวา ถ้า root ใหญ่กว่า ให้สลับค่าลงไป (เรียกว่า percolate down) ทำซ้ำจนกว่าจะไม่ผิด heap-order หรือไม่มีลูกแล้ว
        - paragraph [ref=f37e79]: เลื่อนลงไปด้านล่างเพื่อดู insert/deleteMin ทำงานจริงแบบ debugger ทีละบรรทัด 👇
