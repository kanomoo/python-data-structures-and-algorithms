        - generic [ref=f37e15]: 01 — หลักการ
        - heading "Priority Queue (Heap) คืออะไร และทำไมต้องใช้ Tree" [level=2] [ref=f37e16]
        - paragraph [ref=f37e17]: ไล่อ่านตั้งแต่ concept ไปจนถึงโค้ดจริง 6 หัวข้อ
      - generic [ref=f37e18]:
        - heading "1 Priority Queue คือ ADT ที่ \"ดึงตัวสำคัญสุดออกก่อนเสมอ\"" [level=3] [ref=f37e19]:
          - generic [ref=f37e20]: "1"
          - text: Priority Queue คือ ADT ที่ "ดึงตัวสำคัญสุดออกก่อนเสมอ"
        - paragraph [ref=f37e21]: "Priority Queue ไม่ใช่ FIFO queue ธรรมดา แต่เป็นโครงสร้างข้อมูลที่รองรับอย่างน้อย 2 operation: insert (เหมือน enqueue) และ deleteMin (ค้นหา คืนค่า และลบสมาชิกที่ค่าน้อยที่สุดออก — เหมือน dequeue แต่ดึง \"ตัวเล็กสุด\" แทนที่จะดึง \"ตัวแรกสุด\")"
        - generic [ref=f37e22]:
          - generic [ref=f37e23]: deleteMin
          - generic [ref=f37e25]: Priority Queue
          - generic [ref=f37e26]: insert
        - paragraph [ref=f37e28]: "ใช้งานจริงใน: คิวเครื่องพิมพ์ (งานสำคัญพิมพ์ก่อน), การจัดคิว process ของ OS, และ graph algorithm หลายตัว (เช่น Dijkstra's shortest path)"
        - heading "2 ทำไมไม่ใช้ list ธรรมดา — ต้องมี Binary Heap" [level=3] [ref=f37e29]:
          - generic [ref=f37e30]: "2"
          - text: ทำไมไม่ใช้ list ธรรมดา — ต้องมี Binary Heap
        - paragraph [ref=f37e31]: "ถ้า implement ตรงไปตรงมาด้วย list จะเจอปัญหา insert เร็วแล้ว deleteMin ช้า หรือกลับกันเสมอ Binary Heap คือ compromise ที่ทำให้ทั้งสอง operation เร็วพร้อมกัน:"
