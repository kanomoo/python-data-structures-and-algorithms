            - code [ref=f46e3180]: "class BinaryHeap: def __init__(self, capacity: int = 100): # สร้าง List ขนาด capacity + 1 โดย index 0 ไม่ถูกใช้งาน (1-based indexing) self.array = [None] * (capacity + 1) self.currentSize = 0 def is_empty(self) -> bool: return self.currentSize == 0 def is_full(self) -> bool: return self.currentSize == len(self.array) - 1 def find_min(self): \"\"\"ค้นหาค่าน้อยที่สุดใน O(1)\"\"\" if self.is_empty(): print(\"Heap is empty\") return None return self.array[1] def insert(self, x: int): \"\"\"แทรกข้อมูลพร้อมทำ Percolate Up ใน O(log N)\"\"\" if self.is_full(): print(\"Heap is full\") return self.currentSize += 1 hole = self.currentSize # Percolate Up: ลอยตัวขึ้นไปเปรียบเทียบกับ parent (hole // 2) while hole > 1 and x < self.array[hole // 2]: self.array[hole] = self.array[hole // 2] hole //= 2 self.array[hole] = x print(f\"📥 Inserted {x:2d} -> Current Array (1..{self.currentSize}): {self.array[1:self.currentSize+1]}\") def delete_min(self): \"\"\"ลบและคืนค่าน้อยสุด พร้อมทำ Percolate Down ใน O(log N)\"\"\" if self.is_empty(): print(\"Heap is empty\") return None min_item = self.array[1] # นำสมาชิกตัวสุดท้ายมาเริ่มร่อนลงจากตำแหน่ง Root (hole = 1) self.array[1] = self.array[self.currentSize] self.currentSize -= 1 self._percolate_down(1) print(f\"📤 DeleteMin: คืนค่า {min_item:2d} -> Remaining: {self.array[1:self.currentSize+1]}\") return min_item def _percolate_down(self, hole: int): temp = self.array[hole] while hole * 2 <= self.currentSize: child = hole * 2 # เลือกลูกตัวที่น้อยกว่าระหว่างลูกซ้ายและลูกขวา if child != self.currentSize and self.array[child + 1] < self.array[child]: child += 1 # ถ้าลูกตัวที่น้อยกว่า มีค่าน้อยกว่า temp ให้ดึงลูกขึ้นมา if self.array[child] < temp: self.array[hole] = self.array[child] else: break hole = child self.array[hole] = temp if __name__ == \"__main__\": heap = BinaryHeap(capacity=20) print(\"--- 1. แทรกข้อมูลชุดทดสอบตามข้อสอบ ---\") initial_values = [13, 21, 16, 24, 31, 19, 68, 65, 26, 32] for v in initial_values: heap.insert(v) print(\"\\n--- 2. แทรกเลข 14 เพื่อทดสอบ Percolate Up (ขยับขึ้น 2 ชั้น) ---\") heap.insert(14) print(f\"\\n🔍 ค่าน้อยที่สุดปัจจุบัน (Root): {heap.find_min()}\") print(\"\\n--- 3. ทำ Delete Min ต่อเนื่อง 3 ครั้ง ---\") heap.delete_min() heap.delete_min() heap.delete_min()"
