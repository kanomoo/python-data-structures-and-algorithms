              - generic [ref=f9e1415]:
                - button "▶ รันโค้ดทันที (Run Live)" [ref=f9e1416] [cursor=pointer]
                - button "🔬 เปิดใน Lab ใหญ่" [ref=f9e1417] [cursor=pointer]
                - button "📋 คัดลอก" [ref=f9e1418] [cursor=pointer]
            - code [ref=f9e1420]: "def string_hash(key: str, table_size: int) -> int: \"\"\"คำนวณ Hash จากผลรวมรหัส ASCII ตามข้อสอบ Exams/Hash.py\"\"\" hash_val = 0 print(f\"--- คำนวณ Hash สำหรับ Key: '{key}' ---\") for char in key: code = ord(char) hash_val += code print(f\" ตัวอักษร '{char}' -> ASCII code: {code}\") result = hash_val % table_size print(f\" ผลรวม = {hash_val} | Index = {hash_val} % {table_size} = {result}\") return result class HashTableOpenAddressing: def __init__(self, size: int = 11): self.size = size self.table = [None] * size def _h1(self, k: int) -> int: return k % self.size def _h2(self, k: int) -> int: return 7 - (k % 7) def insert_double_hashing(self, k: int): h1 = self._h1(k) step = self._h2(k) print(f\"\\n📥 แทรก Key: {k} (h1={h1}, step={step})\") for i in range(self.size): slot = (h1 + i * step) % self.size if self.table[slot] is None: self.table[slot] = k print(f\" ✅ Probe #{i}: เจอช่องว่างที่ Index {slot} -> บันทึกสำเร็จ!\") return True else: print(f\" ⚠️ Probe #{i}: ชนกับ {self.table[slot]} ที่ Index {slot}\") print(\" ❌ ตารางเต็ม! ไม่สามารถแทรกได้\") return False if __name__ == \"__main__\": # 1. ทดสอบฟังก์ชัน ASCII Hash ตามข้อสอบจริง string_hash(\"AB\", 10) # 2. ทดสอบจำลองการชนของชุดตัวเลขตามโจทย์ทฤษฎี ht = HashTableOpenAddressing(size=11) # แทรกข้อมูลตั้งต้น initial_keys = [25, 42, 96, 77, 32] for k in initial_keys: ht.insert_double_hashing(k) print(\"\\nสภาพตารางก่อนแทรก 43:\", ht.table) # แทรก 43 ที่เกิดการชนกับ 32 ht.insert_double_hashing(43) print(\"สภาพตารางหลังแทรก 43 สำเร็จ:\", ht.table)"
