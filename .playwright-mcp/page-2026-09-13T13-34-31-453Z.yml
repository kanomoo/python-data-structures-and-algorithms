                - button "📋 คัดลอก" [ref=f46e2257] [cursor=pointer]
            - code [ref=f46e2259]: "class Node: def __init__(self, value: int): self.value = value self.left = None self.right = None class BinarySearchTree: def __init__(self): self.root = None def insert(self, value: int): if self.root is None: self.root = Node(value) else: self._insert_recursive(self.root, value) def _insert_recursive(self, current_node: Node, value: int): if value < current_node.value: if current_node.left is None: current_node.left = Node(value) else: self._insert_recursive(current_node.left, value) elif value > current_node.value: if current_node.right is None: current_node.right = Node(value) else: self._insert_recursive(current_node.right, value) else: # กรณีเจอข้อมูลซ้ำ (Duplicate) ปกติในวิชาเรียนจะละเว้นไม่แทรกซ้ำ pass def search(self, value: int) -> bool: \"\"\"ค้นหาข้อมูลในเวลา O(h)\"\"\" curr = self.root while curr is not None: if curr.value == value: return True elif value < curr.value: curr = curr.left else: curr = curr.right return False def inorder(self): \"\"\"ท่องแบบ Inorder: Left -> Root -> Right (ได้ผลลัพธ์เรียงน้อยไปมาก)\"\"\" result = [] def _inorder(node): if node: _inorder(node.left) result.append(node.value) _inorder(node.right) _inorder(self.root) return result def preorder(self): \"\"\"ท่องแบบ Preorder: Root -> Left -> Right\"\"\" result = [] def _preorder(node): if node: result.append(node.value) _preorder(node.left) _preorder(node.right) _preorder(self.root) return result if __name__ == \"__main__\": bst = BinarySearchTree() # ข้อสอบจริง: แทรกชุดข้อมูล [6, 7, 4, 3, 5, 2, 1] keys = [6, 7, 4, 3, 5, 2, 1] for k in keys: bst.insert(k) print(\"🌳 ข้อมูลที่แทรก:\", keys) print(\"📋 ผลการท่อง Inorder (เรียงน้อยไปมาก):\", bst.inorder()) print(\"📋 ผลการท่อง Preorder (ตามข้อสอบ): \", bst.preorder()) print(\"🔍 ค้นหาเลข 5 ในต้นไม้:\", \"เจอ! (True)\" if bst.search(5) else \"ไม่เจอ\") print(\"🔍 ค้นหาเลข 99 ในต้นไม้:\", \"เจอ! (True)\" if bst.search(99) else \"ไม่เจอ (False)\")"
